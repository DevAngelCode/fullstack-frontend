<h1 class="text-center my-4 services-title">Nuestros Servicios</h1>
<div class="container mt-4 mb-4 cuadroPrincipal">
	<div class="row g-3">
		<!-- Dynamic Services Loop -->
		<div class="col-12 col-sm-6 col-md-4 col-lg-4" *ngFor="let servicio of servicios">
			<div class="card">
				<a [routerLink]="['/servicios', servicio.id]">
					<div class="opacidad"></div>
					<!-- Image from Base64 -->
					<img *ngIf="servicio.imagenBase64" [src]="servicio.imagenBase64"
						class="card-img img-fluid img-cuadro" [alt]="servicio.nombre" width="350px" height="160px">
					<!-- Fallback Image -->
					<img *ngIf="!servicio.imagenBase64" src="assets/img/default-service.jpg"
						class="card-img img-fluid img-cuadro" [alt]="servicio.nombre" width="350px" height="160px">
					<div class="card-img-overlay">
						<h5 class="card-title">{{ servicio.nombre | uppercase }}</h5>
					</div>
				</a>
			</div>
		</div>

		<div *ngIf="servicios.length === 0" class="col-12 text-center">
			<p>No hay servicios disponibles.</p>
		</div>

	</div>
</div>
