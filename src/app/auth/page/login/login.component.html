<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-lg p-0" style="max-width: 450px; width: 100%;">
    <div class="card-header bg-black text-white text-center py-3">
      <h2 class="h3 mb-0 text-uppercase fw-bold"><i class="fa-solid fa-wrench me-2"></i>Iniciar Sesión</h2>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label for="usernameOrEmail" class="form-label text-secondary fw-bold">Usuario o Correo</label>
          <div class="input-group">
            <span class="input-group-text bg-dark text-white"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="usernameOrEmail" formControlName="usernameOrEmail" class="form-control"
              [class.is-invalid]="loginForm.get('usernameOrEmail')?.invalid && loginForm.get('usernameOrEmail')?.touched"
              placeholder="Ingresa tu usuario o correo">
            <div *ngIf="loginForm.get('usernameOrEmail')?.invalid && loginForm.get('usernameOrEmail')?.touched"
              class="invalid-feedback">
              Este campo es requerido.
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label text-secondary fw-bold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-dark text-white"><i class="fa-solid fa-lock"></i></span>
            <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
              class="form-control"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              placeholder="Ingresa tu contraseña">
            <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()">
              <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              class="invalid-feedback">
              La contraseña es requerida.
            </div>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3">
          {{ errorMessage }}
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-dark btn-lg fw-bold" [disabled]="loginForm.invalid">INGRESAR</button>
        </div>
      </form>
      <div class="mt-3 text-center">
        <p class="text-muted">¿No tienes cuenta? <a routerLink="/auth/register"
            class="text-dark text-decoration-none fw-bold">Regístrate aquí</a></p>
      </div>
    </div>
  </div>
</div>
