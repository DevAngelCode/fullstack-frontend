<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <img src="assets/logo-mechanic.png" alt="Mechanic Company Logo" class="mx-auto h-20 w-auto mb-4">
      <h2 class="text-3xl font-extrabold text-gray-900">Iniciar Sesión</h2>
      <p class="mt-2 text-sm text-gray-600">
        Bienvenido de nuevo, por favor ingresa tus credenciales.
      </p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="mb-4">
        <label for="usernameOrEmail" class="block text-sm font-medium text-gray-700">Usuario o Email</label>
        <input
          type="text"
          id="usernameOrEmail"
          formControlName="usernameOrEmail"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="Tu nombre de usuario o email"
        />
        <div *ngIf="loginForm.get('usernameOrEmail')?.invalid && loginForm.get('usernameOrEmail')?.touched" class="text-red-500 text-xs mt-1">
          El usuario o email es requerido.
        </div>
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="Tu contraseña"
        />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-xs mt-1">
          La contraseña es requerida.
        </div>
      </div>
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50"
      >
        Iniciar Sesión
      </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
      ¿No tienes una cuenta?
      <a routerLink="/auth/register" class="font-medium text-indigo-600 hover:text-indigo-500">Regístrate aquí</a>
    </p>
    <div *ngIf="errorMessage" class="mt-4 text-center text-red-600 text-sm">
      {{ errorMessage }}
    </div>
  </div>
</div>
