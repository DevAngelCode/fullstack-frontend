<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg p-4">
        <div class="card-header bg-primary text-white text-center py-3 rounded-top">
          <h2 class="h3 mb-0">Iniciar Sesión</h2>
        </div>
        <div class="card-body">
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="mb-3">
              <label for="usernameOrEmail" class="form-label">Nombre de Usuario o Correo Electrónico</label>
              <input type="text" id="usernameOrEmail" formControlName="usernameOrEmail" class="form-control"
                     [class.is-invalid]="loginForm.get('usernameOrEmail')?.invalid && loginForm.get('usernameOrEmail')?.touched"
                     placeholder="Ingresa tu nombre de usuario o correo electrónico">
              <div *ngIf="loginForm.get('usernameOrEmail')?.invalid && loginForm.get('usernameOrEmail')?.touched" class="invalid-feedback">
                El nombre de usuario o correo electrónico es requerido.
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" formControlName="password" class="form-control"
                     [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                     placeholder="Ingresa tu contraseña">
              <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
                La contraseña es requerida.
              </div>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger mt-3">
              {{ errorMessage }}
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg mt-3" [disabled]="loginForm.invalid">Iniciar Sesión</button>
            </div>
          </form>
          <div class="mt-3 text-center">
            <p>¿No tienes una cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
