<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="text-center mb-6">
      <img src="assets/logo-mechanic.png" alt="Mechanic Company Logo" class="mx-auto h-20 w-auto mb-4">
      <h2 class="text-3xl font-extrabold text-gray-900">Registrarse</h2>
      <p class="mt-2 text-sm text-gray-600">
        Crea tu cuenta para acceder a nuestros servicios.
      </p>
    </div>
    <form [formGroup]="registerForm" (ngSubmit)="register()">
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-gray-700">Usuario</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="Tu nombre de usuario"
        />
        <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="text-red-500 text-xs mt-1">
          El usuario es requerido.
        </div>
      </div>
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="tu@ejemplo.com"
        />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-red-500 text-xs mt-1">
          Ingresa un email válido.
        </div>
      </div>
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="Tu contraseña"
        />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-red-500 text-xs mt-1">
          La contraseña es requerida y debe tener al menos 6 caracteres.
        </div>
      </div>
      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50"
      >
        Registrarse
      </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
      ¿Ya tienes una cuenta?
      <a routerLink="/auth/login" class="font-medium text-indigo-600 hover:text-indigo-500">Inicia sesión aquí</a>
    </p>
    <div *ngIf="errorMessage" class="mt-4 text-center text-red-600 text-sm">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="mt-4 text-center text-green-600 text-sm">
      {{ successMessage }}
    </div>
  </div>
</div>
