<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg p-4">
        <div class="card-header bg-primary text-white text-center py-3 rounded-top">
          <h2 class="h3 mb-0">Registrarse</h2>
        </div>
        <div class="card-body">
          <form [formGroup]="registerForm" (ngSubmit)="register()">
            <div class="mb-3">
              <label for="username" class="form-label">Nombre de Usuario</label>
              <input type="text" id="username" formControlName="username" class="form-control"
                     [class.is-invalid]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"
                     placeholder="Ingresa tu nombre de usuario">
              <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="invalid-feedback">
                El nombre de usuario es requerido.
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" id="email" formControlName="email" class="form-control"
                     [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
                     placeholder="Ingresa tu correo electrónico">
              <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="invalid-feedback">
                <span *ngIf="registerForm.get('email')?.errors?.['required']">El correo electrónico es requerido.</span>
                <span *ngIf="registerForm.get('email')?.errors?.['email']">Por favor, introduce un correo electrónico válido.</span>
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" formControlName="password" class="form-control"
                     [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
                     placeholder="Ingresa tu contraseña">
              <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="invalid-feedback">
                <span *ngIf="registerForm.get('password')?.errors?.['required']">La contraseña es requerida.</span>
                <span *ngIf="registerForm.get('password')?.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</span>
              </div>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger mt-3">
              {{ errorMessage }}
            </div>
            <div *ngIf="successMessage" class="alert alert-success mt-3">
              {{ successMessage }}
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg mt-3" [disabled]="registerForm.invalid">Registrarse</button>
            </div>
          </form>
          <div class="mt-3 text-center">
            <p>¿Ya tienes una cuenta? <a routerLink="/auth/login">Inicia Sesión aquí</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
