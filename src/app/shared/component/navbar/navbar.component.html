<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: black;">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center fw-bold text-uppercase" routerLink="/">
      <i class="fa-solid fa-car-side fa-lg me-2 text-light"></i>
      Auto Pro
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Left Aligned Links (Main Navigation) -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Public Links -->
        <ng-container *ngIf="!hasRole('ROLE_ADMIN') && !hasRole('ROLE_TECNICO')">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
              <i class="fa-solid fa-house me-1"></i> Inicio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/servicios" routerLinkActive="active">
              <i class="fa-solid fa-screwdriver-wrench me-1"></i> Servicios
            </a>
          </li>
        </ng-container>

        <!-- Authenticated Links -->
        <ng-container *ngIf="isLoggedIn">
          <!-- Admin Links -->
          <li class="nav-item" *ngIf="hasRole('ROLE_ADMIN')">
            <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active">
              <i class="fa-solid fa-gauge me-1"></i> Admin Dashboard
            </a>
          </li>
          <li class="nav-item" *ngIf="hasRole('ROLE_ADMIN')">
            <a class="nav-link" routerLink="/admin/servicios" routerLinkActive="active">
              <i class="fa-solid fa-screwdriver-wrench me-1"></i> Servicios
            </a>
          </li>
          <li class="nav-item" *ngIf="hasRole('ROLE_ADMIN')">
            <a class="nav-link" routerLink="/admin/sedes" routerLinkActive="active">
              <i class="fa-solid fa-building me-1"></i> Sedes
            </a>
          </li>
          <li class="nav-item" *ngIf="hasRole('ROLE_ADMIN')">
            <a class="nav-link" routerLink="/admin/usuarios" routerLinkActive="active">
              <i class="fa-solid fa-users me-1"></i> Usuarios
            </a>
          </li>

          <!-- Client Links -->
          <li class="nav-item" *ngIf="hasRole('ROLE_CLIENTE')">
            <a class="nav-link" routerLink="/cliente/citas" routerLinkActive="active">
              <i class="fa-solid fa-calendar-check me-1"></i> Mis Citas
            </a>
          </li>

          <!-- Technician Links -->
          <li class="nav-item" *ngIf="hasRole('ROLE_TECNICO')">
            <a class="nav-link" routerLink="/tecnico/dashboard" routerLinkActive="active">
              <i class="fa-solid fa-gauge me-1"></i> Dashboard
            </a>
          </li>
          <li class="nav-item" *ngIf="hasRole('ROLE_TECNICO')">
            <a class="nav-link" routerLink="/tecnico/gestionar-citas" routerLinkActive="active">
              <i class="fa-solid fa-list-check me-1"></i> Gestionar Citas
            </a>
          </li>
        </ng-container>
      </ul>

      <!-- Right Aligned Items (Profile & Auth) -->
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
        <!-- Profile Dropdown (Authenticated) -->
        <li class="nav-item dropdown" *ngIf="isLoggedIn">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button"
            data-bs-toggle="dropdown" aria-expanded="false">
            <!-- Avatar -->
            <div class="rounded-circle overflow-hidden border border-2 border-secondary me-2"
              style="width: 35px; height: 35px; background-color: #333;">
              <img [src]="(authService.currentUserValue?.imagenBase64) || 'assets/default.webp'" alt="Avatar"
                class="w-100 h-100 object-fit-cover">
            </div>
            <span class="d-none d-lg-inline">{{ authService.currentUserValue?.username }}</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark" aria-labelledby="navbarDropdown">
            <li>
              <a class="dropdown-item"
                [routerLink]="hasRole('ROLE_ADMIN') ? '/admin/profile' : (hasRole('ROLE_TECNICO') ? '/tecnico/profile' : '/cliente/profile')">
                <i class="fa-solid fa-user me-2"></i> Mi Perfil
              </a>
            </li>
            <!-- Redundant dashboard links in dropdown removed for cleaner UI as they are on the bar now, or can keep as shortcut -->
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <button class="dropdown-item text-danger" (click)="logout()">
                <i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar Sesión
              </button>
            </li>
          </ul>
        </li>

        <!-- Auth Buttons (Non-Authenticated) -->
        <ng-container *ngIf="!isLoggedIn">
          <li class="nav-item">
            <a class="nav-link" routerLink="/auth/login" routerLinkActive="active">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Iniciar Sesión
            </a>
          </li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-light text-primary fw-bold btn-sm" routerLink="/auth/register" routerLinkActive="active">
              <i class="fa-solid fa-user-plus me-1"></i> Registrarse
            </a>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
